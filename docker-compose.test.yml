services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only-database
      POSTGRES_DB: clinic_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d clinic_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    image: golang:1.23-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      TEST_DATABASE_URL: postgres://test:test-only-database@db:5432/clinic_test?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "gofmt -w . && go vet ./... && go test -count=1 ./..."]
